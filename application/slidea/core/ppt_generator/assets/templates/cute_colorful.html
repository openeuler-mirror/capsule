<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>可爱风格PPT - 元气满满的一天</title>
    <script src="https://cdn.jsdmirror.com/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <script defer src="https://cdn.jsdelivr.net.cn/npm/@fortawesome/fontawesome-free@6.4.0/js/all.min.js"></script>
    <!-- 1. 引入 KaTeX 的 CSS 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/katex.min.css">
    <!-- 2. 引入 KaTeX 的 JS 核心库 -->
    <script defer src="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- 3. 引入自动渲染扩展 (用于自动寻找 $...$) -->
    <script defer src="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- 4. 触发渲染 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                // 自定义定界符
                delimiters: [
                    {left: '$$', right: '$$', display: true},  // 块级公式
                    {left: '$', right: '$', display: false}, // 行内公式
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false // 遇到错误公式不报错，而是输出红字
            });
        });
    </script>
    <style>
        body, html {
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFF8FC;
        }

        #ppt-container {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            background-color: #FFF8FC;
            position: relative;
            overflow: hidden;
        }

        .section-container {
            min-height: 0;
            min-width: 0;
            padding: 0 45px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            z-index: 10; /* Ensure content is above background decorations */
        }

        .scalable-content {
            width: 100%;
            height: 100%; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform-origin: top left;
        }

        /* 卡片样式 */
        .glass-card {
            background-color: #FFFFFF;
            border: 1px solid #C4B5FD;
            border-radius: 1.5rem; /* rounded-2xl */
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 移除固定高度，依靠内容或父容器分配 */
            width: 280px;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
<!--
颜色说明：
1. 背景色：#FFF8FC
   使用要求：页面背景，仅用于整体底色或柔和留白区域。

2. 主色：#FF8FB1
   使用要求：用于核心视觉元素、重点模块、按钮和一级强调。

3. 强调色：#A78BFA
   使用要求：用于标题强调线、重点高亮、局部强调和二级视觉焦点，不应大面积使用。

4. 正文文字色：#5B556D
   使用要求：用于主要正文、表格主文字、说明文字。

5. 辅助文字色：#7B8794
   使用要求：用于注释、说明、次级标签、弱化信息。

6. 边框/分割线色：#C4B5FD
   使用要求：用于边框、辅助线、分割线、浅色容器描边。

7. 可选警示色：#FB7185
   使用要求：仅在表达风险、问题、下降时使用。

8. 可选成功色：#6EE7B7
   使用要求：仅在表达增长、完成、正向结果时使用。
-->
<div id="ppt-container" data-description="固定页面容器；保留可爱彩色模板背景、页脚和整体尺寸。">
    <!-- 头部区域 (Header) -->
    <!-- 由于没有特定高度限制，这里给一点 padding 让它自然撑开，或者作为 flex item -->
    <div id="header" data-description="内容页固定标题栏；只替换标题文字，不加额外标题装饰。" class="h-32 flex flex-col justify-center items-center z-10 shrink-0">
        <h1 id="page-title-text" data-description="标题固定样式：text-5xl font-black text-[#5B556D] tracking-wider mb-2，含魔法棒图标。" class="text-5xl font-black text-[#5B556D] tracking-wider mb-2">
            <i class="fa-solid fa-wand-magic-sparkles text-[#FF8FB1] mr-4"></i>
            {{PAGE_TITLE}}
        </h1>
        <p id="template-subtitle" data-description="固定副标题风格，可替换为简短副标题，也可删除。" class="text-2xl text-[#7B8794] font-medium">A little guide to a happy day!</p>
    </div>

    <div class="section-container">
        <div class="scalable-content">
            <!-- 核心布局容器：标题+内容 模式 -->
            <!-- 这里因为标题已经在外部（Header），我们主要处理内容区的分布 -->
            <!-- 为了符合"Title and Content together"的规则，如果视为一个整体Section，结构如下： -->

            <div id="main-content-safe-area" data-description="主体内容范围；正式内容应在此区域内布局。" class="w-full h-full flex flex-col">
                <!-- 内容区域：必须用 justify-around 包裹 -->
                <!-- 方向为横向 (flex-row) 以排列三个卡片 -->
                <div id="content-placeholder" data-description="示例占位内容，正式输出删除并替换为真实内容模块。" class="flex-1 flex flex-row justify-around items-center">

                    <!-- 卡片 1: 清晨 -->
                    <div class="glass-card">
                        <div class="flex-1 flex flex-col justify-center items-center py-4">
                            <i class="fa-solid fa-sun text-7xl text-[#FF8FB1] mb-4"></i>
                            <h2 class="text-3xl font-bold text-[#5B556D] mb-2">清晨阳光</h2>
                            <p class="text-[#7B8794] text-lg leading-relaxed">
                                用微笑迎接第一缕阳光<br>做点简单的伸展运动
                            </p>
                        </div>
                    </div>

                    <!-- 卡片 2: 午后 -->
                    <div class="glass-card">
                        <div class="flex-1 flex flex-col justify-center items-center py-4">
                            <i class="fa-solid fa-mug-hot text-7xl text-[#A78BFA] mb-4"></i>
                            <h2 class="text-3xl font-bold text-[#5B556D] mb-2">午后小憩</h2>
                            <p class="text-[#7B8794] text-lg leading-relaxed">
                                一杯热茶或咖啡<br>搭配一本好书放松心情
                            </p>
                        </div>
                    </div>

                    <!-- 卡片 3: 夜晚 -->
                    <div class="glass-card">
                        <div class="flex-1 flex flex-col justify-center items-center py-4">
                            <i class="fa-solid fa-star text-7xl text-[#6EE7B7] mb-4"></i>
                            <h2 class="text-3xl font-bold text-[#5B556D] mb-2">静谧夜晚</h2>
                            <p class="text-[#7B8794] text-lg leading-relaxed">
                                写下今天的美好瞬间<br>带着感恩的心进入梦乡
                            </p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <footer class="h-12 flex justify-center items-center z-10 text-[#7B8794] font-medium">
        <p>Have a wonderful day! ✨</p>
    </footer>
</div>

<script>
    function scaleContentToFit() {
        const sections = document.querySelectorAll('.section-container');
        sections.forEach(section => {
            const contentWrapper = section.querySelector('.scalable-content');
            const content = contentWrapper ? contentWrapper.firstElementChild : null;
            if (!contentWrapper || !content) return;

            contentWrapper.style.transform = 'scale(1)';
            contentWrapper.style.zoom = 1;

            const styles = window.getComputedStyle(section);

            const paddingTop = parseFloat(styles.paddingTop);
            const paddingBottom = parseFloat(styles.paddingBottom);
            const paddingLeft = parseFloat(styles.paddingLeft);
            const paddingRight = parseFloat(styles.paddingRight);

            const ORIGINAL_HEIGHT = section.clientHeight - paddingTop - paddingBottom;
            const ORIGINAL_WIDTH = section.clientWidth - paddingLeft - paddingRight;
            if (Math.abs(contentWrapper.scrollWidth - ORIGINAL_WIDTH) < 1 && Math.abs(contentWrapper.scrollHeight - ORIGINAL_HEIGHT) < 1) {
                window.final_ratio = 1;
                return;
            }

            const TARGET_ASPECT_RATIO = ORIGINAL_HEIGHT / ORIGINAL_WIDTH;

            let testWidth = ORIGINAL_WIDTH;

            let bestWidth = ORIGINAL_WIDTH;
            let minDifference = Infinity;

            for (let i = 0; i < 300; i++) {
                testWidth = testWidth + 5;
                content.style.width = `${testWidth}px`;

                const actualHeight = content.scrollHeight;
                const targetHeight = testWidth * TARGET_ASPECT_RATIO;

                const currentDifference = Math.abs(actualHeight - targetHeight);

                if (currentDifference < minDifference) {
                    minDifference = currentDifference;
                    bestWidth = testWidth;
                }
            }

            content.style.width = `${bestWidth}px`;

            const finalWidth = content.scrollWidth;
            const finalHeight = content.scrollHeight;

            const scaleX = ORIGINAL_WIDTH / finalWidth;
            const scaleY = ORIGINAL_HEIGHT / finalHeight;

            const scaleRatio = Math.min(scaleX, scaleY);
            window.final_ratio = scaleRatio;
            contentWrapper.style.transform = 'none';
            contentWrapper.style.zoom = scaleRatio;
        });
    }

    window.addEventListener('load', scaleContentToFit);
    window.addEventListener('resize', scaleContentToFit);
</script>
</body>
</html>
