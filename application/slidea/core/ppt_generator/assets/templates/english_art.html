<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern English Stylized Template</title>
    
    <!-- 必须的 Tailwind CSS -->
    <script src="https://cdn.jsdmirror.com/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
    <!-- 必须的 Chart.js -->
    <script src="https://cdn.jsdelivr.net.cn/npm/chart.js"></script>

    <!-- 必须的 KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net.cn/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters:[
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
            });
        });
    </script>

    <!-- 引入高对比度衬线体(Playfair Display) 和 现代无衬线体(Inter) -->
    <link href="https://fonts.googleapis.cn/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
    <style>
        body, html {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e5e7eb; 
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .font-stylized {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            letter-spacing: -0.02em;
        }

        #ppt-container {
            width: 1280px;
            height: 720px;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #FAF9F6;
            border: 1px solid #d4d4d4;
        }

        .section-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
            flex-direction: column;
            box-sizing: border-box;
            min-height: 0;
            margin-bottom: 20px;
        }

        .scalable-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform-origin: top left;
            min-height: 0;
        }

        /* 装饰性分隔线 */
        .decoration-line {
            height: 1px;
            background: #555;
            width: 60%;
            margin: 0 auto;
        }

        .corner-row {
            display: flex;
            flex: 0 0 auto;
        }

        .corner-row-end {
            justify-content: flex-end;
        }

        .paper-corner {
            width: 24px;
            height: 24px;
            box-sizing: border-box;
            border-color: #9ca3af;
        }

        .paper-corner-top {
            border-top-width: 1px;
            border-left-width: 1px;
        }

        .paper-corner-bottom {
            border-bottom-width: 1px;
            border-right-width: 1px;
        }
    </style>
</head>
<body>

    <!-- 主容器 -->
    <div id="ppt-container" class="flex flex-col box-border">
        
        <!-- Header - 占据空间调小 (pt-6 pb-2) -->
        <header class="flex-none px-16 pt-6 pb-2 text-center">
            <h1 class="text-5xl font-stylized text-[#2c2c2c]">{{PAGE_TITLE}}</h1>
        </header>

        <!-- Main Content 区域 -->
        <div class="section-container flex-1 px-8 py-4">
            <div class="scalable-content">
                <div class="flex-1 flex flex-col w-full h-full border border-gray-300 p-4 min-h-0">
                    <div class="corner-row">
                        <div class="paper-corner paper-corner-top"></div>
                    </div>
                    <div class="flex-1 flex flex-col justify-center items-center min-h-0 px-6 py-4">
                        <div class="text-center min-h-0">
                            <!-- 内容区域标题及描述全部改为 italic -->
                            <p class="text-4xl font-stylized text-[#4a4a4a] mb-6 italic">{{CONTENT_AREA}}</p>
                            
                            <div class="decoration-line mb-6"></div>

                            <p class="text-sm tracking-widest text-gray-500 uppercase italic">
                                Minimalist Aesthetics & Structural Design
                            </p>
                        </div>
                    </div>
                    <div class="corner-row corner-row-end">
                        <div class="paper-corner paper-corner-bottom"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 必须保留的缩放脚本 -->
    <script>
        function scaleContentToFit() {
            const sections = document.querySelectorAll('.section-container');
            sections.forEach(section => {
                const contentWrapper = section.querySelector('.scalable-content');
                const content = contentWrapper ? contentWrapper.firstElementChild : null;
                if (!contentWrapper || !content) return;

                contentWrapper.style.transform = 'scale(1)';
                contentWrapper.style.zoom = 1;

                const styles = window.getComputedStyle(section);
                const paddingTop = parseFloat(styles.paddingTop);
                const paddingBottom = parseFloat(styles.paddingBottom);
                const paddingLeft = parseFloat(styles.paddingLeft);
                const paddingRight = parseFloat(styles.paddingRight);

                const ORIGINAL_HEIGHT = section.clientHeight - paddingTop - paddingBottom;
                const ORIGINAL_WIDTH = section.clientWidth - paddingLeft - paddingRight;
                
                if (Math.abs(contentWrapper.scrollWidth - ORIGINAL_WIDTH) < 1 && Math.abs(contentWrapper.scrollHeight - ORIGINAL_HEIGHT) < 1) {
                    window.final_ratio = 1;
                    return;
                }

                const TARGET_ASPECT_RATIO = ORIGINAL_HEIGHT / ORIGINAL_WIDTH;
                let testWidth = ORIGINAL_WIDTH;
                let bestWidth = ORIGINAL_WIDTH;
                let minDifference = Infinity;

                for (let i = 0; i < 300; i++) {
                    testWidth = testWidth + 5;
                    content.style.width = `${testWidth}px`;
                    const actualHeight = content.scrollHeight;
                    const targetHeight = testWidth * TARGET_ASPECT_RATIO;
                    const currentDifference = Math.abs(actualHeight - targetHeight);
                    if (currentDifference < minDifference) {
                        minDifference = currentDifference;
                        bestWidth = testWidth;
                    }
                }

                content.style.width = `${bestWidth}px`;
                const finalWidth = content.scrollWidth;
                const finalHeight = content.scrollHeight;
                const scaleX = ORIGINAL_WIDTH / finalWidth;
                const scaleY = ORIGINAL_HEIGHT / finalHeight;
                const scaleRatio = Math.min(scaleX, scaleY);
                window.final_ratio = scaleRatio;
                contentWrapper.style.transform = 'none';
                contentWrapper.style.zoom = scaleRatio;
            });
        }

        window.addEventListener('load', scaleContentToFit);
        window.addEventListener('resize', scaleContentToFit);
    </script>
</body>
</html>
