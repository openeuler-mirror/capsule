<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background" data-description="固定背景，保留。">
    <rect id="slide-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header" data-description="内容页固定标题栏；只替换标题文字，不加额外标题装饰。">
    <text id="page-title-text" data-description="标题固定样式：x=28 y=57 font-size=38 font-weight=700。" x="28" y="57" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#2563D9">{{PAGE_TITLE}}</text>
    <line id="title-accent-line" x1="28" y1="78" x2="303" y2="78" stroke="#2563D9" stroke-width="4"/>
  </g>

  <g id="main-content-safe-area" data-description="主体内容范围：x=28 y=105 width=1224 height=581。">
    <rect id="content-safe-area-guide" data-description="辅助边界框，正式输出删除。" x="28" y="105" width="1224" height="581" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g id="content-placeholder" data-description="占位提示，正式输出删除。">
    <text id="content-placeholder-label" x="640" y="360" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#6B7280">CONTENT_AREA</text>
    <text id="content-placeholder-hint" x="640" y="402" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7280">实际内容</text>
  </g>

  <g id="palette-sample" data-description="颜色示例色卡，仅供模板预览，正式输出必须删除。">
    <text x="40" y="575" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7280">颜色示例色卡，正式输出删除</text>

    <g id="palette-background-color" data-description="背景色：#FFFFFF；使用要求：页面背景，仅用于整体底色或大面积留白区域。">
      <rect x="40" y="592" width="96" height="34" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="40" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">背景色</text>
      <text x="40" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#FFFFFF</text>
    </g>

    <g id="palette-primary-color" data-description="主色：#2563D9；使用要求：用于页面标题、标题强调线、核心视觉元素。">
      <rect x="180" y="592" width="96" height="34" rx="6" fill="#2563D9"/>
      <text x="180" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">主色</text>
      <text x="180" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#2563D9</text>
    </g>

    <g id="palette-accent-color" data-description="强调色：#60A5FA；使用要求：用于重点数据、辅助高亮、局部强调，不应大面积使用。">
      <rect x="320" y="592" width="96" height="34" rx="6" fill="#60A5FA"/>
      <text x="320" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">强调色</text>
      <text x="320" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#60A5FA</text>
    </g>

    <g id="palette-body-text-color" data-description="正文文字色：#111827；使用要求：用于主要正文、表格主文字、说明文字。">
      <rect x="460" y="592" width="96" height="34" rx="6" fill="#111827"/>
      <text x="460" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">正文文字色</text>
      <text x="460" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#111827</text>
    </g>

    <g id="palette-muted-text-color" data-description="辅助文字色：#6B7280；使用要求：用于注释、说明、次级标签、弱化信息。">
      <rect x="600" y="592" width="96" height="34" rx="6" fill="#6B7280"/>
      <text x="600" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">辅助文字色</text>
      <text x="600" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#6B7280</text>
    </g>

    <g id="palette-border-color" data-description="边框/分割线色：#E5E7EB；使用要求：用于边框、辅助线、分割线、浅色容器描边。">
      <rect x="740" y="592" width="96" height="34" rx="6" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="1"/>
      <text x="740" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">边框/分割线</text>
      <text x="740" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#E5E7EB</text>
    </g>

    <g id="palette-warning-color" data-description="可选警示色：#DC2626；使用要求：仅在表达风险、问题、下降时使用。">
      <rect x="880" y="592" width="96" height="34" rx="6" fill="#DC2626"/>
      <text x="880" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">可选警示色</text>
      <text x="880" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#DC2626</text>
    </g>

    <g id="palette-success-color" data-description="可选成功色：#16A34A；使用要求：仅在表达增长、完成、正向结果时使用。">
      <rect x="1020" y="592" width="96" height="34" rx="6" fill="#16A34A"/>
      <text x="1020" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">可选成功色</text>
      <text x="1020" y="664" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">#16A34A</text>
    </g>
  </g>
</svg>
