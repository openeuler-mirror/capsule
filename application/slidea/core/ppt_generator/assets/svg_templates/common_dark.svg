<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background" data-description="固定背景，保留。">
    <rect id="slide-background" x="0" y="0" width="1280" height="720" fill="#1E293B"/>
  </g>

  <g id="header" data-description="内容页固定标题栏；只替换标题文字，不加额外标题装饰。">
    <text id="page-title-text" data-description="标题固定样式：x=42 y=64 font-size=32 font-weight=700。" x="42" y="64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#F9FAFB">{{PAGE_TITLE}}</text>
  </g>

  <g id="main-content-safe-area" data-description="主体内容范围：x=42 y=113 width=1196 height=580。">
    <rect id="content-safe-area-guide" data-description="辅助边界框，正式输出删除。" x="42" y="113" width="1196" height="580" fill="#1E293B" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.95"/>
  </g>

  <g id="content-placeholder" data-description="占位提示，正式输出删除。">
    <text id="content-placeholder-label" x="640" y="394" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#F9FAFB">CONTENT_AREA</text>
    <text id="content-placeholder-hint" x="640" y="436" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF">实际内容</text>
  </g>
  <g id="palette-sample" data-description="颜色示例色卡，仅供模板预览，正式输出必须删除。">
    <text x="62" y="575" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#CBD5E1">颜色示例色卡，正式输出删除</text>

    <g id="palette-background-color" data-description="背景色：#1E293B；使用要求：页面背景，仅用于整体底色或深色大面积区域。">
      <rect x="62" y="592" width="96" height="34" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="62" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">背景色</text>
      <text x="62" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#1E293B</text>
    </g>

    <g id="palette-primary-color" data-description="主色：#F9FAFB；使用要求：用于页面标题、深色背景上的核心文字和关键视觉元素。">
      <rect x="202" y="592" width="96" height="34" rx="6" fill="#F9FAFB" stroke="#475569" stroke-width="1"/>
      <text x="202" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">主色</text>
      <text x="202" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#F9FAFB</text>
    </g>

    <g id="palette-accent-color" data-description="强调色：#38BDF8；使用要求：用于重点数据、辅助高亮、局部强调，不应大面积使用。">
      <rect x="342" y="592" width="96" height="34" rx="6" fill="#38BDF8"/>
      <text x="342" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">强调色</text>
      <text x="342" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#38BDF8</text>
    </g>

    <g id="palette-body-text-color" data-description="正文文字色：#F9FAFB；使用要求：用于主要正文、表格主文字、说明文字。">
      <rect x="482" y="592" width="96" height="34" rx="6" fill="#F9FAFB" stroke="#475569" stroke-width="1"/>
      <text x="482" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">正文文字色</text>
      <text x="482" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#F9FAFB</text>
    </g>

    <g id="palette-muted-text-color" data-description="辅助文字色：#9CA3AF；使用要求：用于注释、说明、次级标签、弱化信息。">
      <rect x="622" y="592" width="96" height="34" rx="6" fill="#9CA3AF"/>
      <text x="622" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">辅助文字色</text>
      <text x="622" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#9CA3AF</text>
    </g>

    <g id="palette-border-color" data-description="边框/分割线色：#475569；使用要求：用于边框、辅助线、分割线、深色容器描边。">
      <rect x="762" y="592" width="96" height="34" rx="6" fill="#475569" stroke="#475569" stroke-width="1"/>
      <text x="762" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">边框/分割线</text>
      <text x="762" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#475569</text>
    </g>

    <g id="palette-warning-color" data-description="可选警示色：#F87171；使用要求：仅在表达风险、问题、下降时使用。">
      <rect x="902" y="592" width="96" height="34" rx="6" fill="#F87171"/>
      <text x="902" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">可选警示色</text>
      <text x="902" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#F87171</text>
    </g>

    <g id="palette-success-color" data-description="可选成功色：#4ADE80；使用要求：仅在表达增长、完成、正向结果时使用。">
      <rect x="1042" y="592" width="96" height="34" rx="6" fill="#4ADE80"/>
      <text x="1042" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#CBD5E1">可选成功色</text>
      <text x="1042" y="664" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">#4ADE80</text>
    </g>
  </g>
</svg>
