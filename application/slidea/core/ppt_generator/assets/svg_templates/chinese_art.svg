<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background" data-description="固定背景，保留。">
    <rect id="slide-background" x="0" y="0" width="1280" height="720" fill="#FBF7ED"/>
    <rect id="slide-border" x="1" y="1" width="1278" height="718" fill="none" stroke="#D6C8B8" stroke-width="1"/>
  </g>

  <g id="header" data-description="内容页固定标题栏；只替换标题文字，不加额外标题装饰。">
    <text id="page-title-text" data-description="标题固定样式：x=42 y=64 font-size=34 font-weight=700。" x="42" y="64" font-family="Microsoft YaHei, SimSun, KaiTi, serif" font-size="34" font-weight="700" fill="#3F3933">{{PAGE_TITLE}}</text>
  </g>

  <g id="main-content-frame" data-description="主体装饰框，正式输出保留；内容布局在框内。">
    <rect id="content-frame-outer" x="42" y="118" width="1196" height="574" fill="none" stroke="#C6B6A5" stroke-width="1"/>
    <rect id="content-frame-inner" x="45" y="121" width="1190" height="568" fill="none" stroke="#C6B6A5" stroke-width="1"/>
  </g>

  <g id="main-content-safe-area" data-description="主体内容范围：x=70 y=145 width=1140 height=520。">
  </g>

  <g id="content-placeholder" data-description="占位提示，正式输出删除。">
    <text id="content-placeholder-label" x="640" y="398" text-anchor="middle" font-family="Times New Roman, Microsoft YaHei, SimSun, serif" font-size="30" font-weight="700" letter-spacing="3" fill="#3F3933">CONTENT_AREA</text>
    <text id="content-placeholder-hint" x="640" y="440" text-anchor="middle" font-family="Microsoft YaHei, SimSun, KaiTi, serif" font-size="18" font-weight="400" fill="#8C8070">实际内容</text>
  </g>

  <g id="palette-sample" data-description="颜色示例色卡，仅供模板预览，正式输出必须删除。">
    <text x="70" y="575" font-family="Microsoft YaHei, SimSun, KaiTi, serif" font-size="14" font-weight="700" fill="#8C8070">颜色示例色卡，正式输出删除</text>

    <g id="palette-background-color" data-description="背景色：#FBF7ED；使用要求：页面背景，仅用于整体底色或宣纸感留白区域。">
      <rect x="70" y="592" width="96" height="34" rx="6" fill="#FBF7ED" stroke="#D6C8B8" stroke-width="1.5"/>
      <text x="70" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">背景色</text>
      <text x="70" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#FBF7ED</text>
    </g>

    <g id="palette-primary-color" data-description="主色：#3F3933；使用要求：用于页面标题、核心视觉元素、国风主题主文字。">
      <rect x="210" y="592" width="96" height="34" rx="6" fill="#3F3933"/>
      <text x="210" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">主色</text>
      <text x="210" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#3F3933</text>
    </g>

    <g id="palette-accent-color" data-description="强调色：#8C5A2B；使用要求：用于重点数据、印章式高亮、局部强调，不应大面积使用。">
      <rect x="350" y="592" width="96" height="34" rx="6" fill="#8C5A2B"/>
      <text x="350" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">强调色</text>
      <text x="350" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#8C5A2B</text>
    </g>

    <g id="palette-body-text-color" data-description="正文文字色：#3F3933；使用要求：用于主要正文、表格主文字、说明文字。">
      <rect x="490" y="592" width="96" height="34" rx="6" fill="#3F3933"/>
      <text x="490" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">正文文字色</text>
      <text x="490" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#3F3933</text>
    </g>

    <g id="palette-muted-text-color" data-description="辅助文字色：#8C8070；使用要求：用于注释、说明、次级标签、弱化信息。">
      <rect x="630" y="592" width="96" height="34" rx="6" fill="#8C8070"/>
      <text x="630" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">辅助文字色</text>
      <text x="630" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#8C8070</text>
    </g>

    <g id="palette-border-color" data-description="边框/分割线色：#C6B6A5；使用要求：用于边框、辅助线、分割线、国风双线框描边。">
      <rect x="770" y="592" width="96" height="34" rx="6" fill="#C6B6A5" stroke="#C6B6A5" stroke-width="1"/>
      <text x="770" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">边框/分割线</text>
      <text x="770" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#C6B6A5</text>
    </g>

    <g id="palette-warning-color" data-description="可选警示色：#B91C1C；使用要求：仅在表达风险、问题、下降时使用。">
      <rect x="910" y="592" width="96" height="34" rx="6" fill="#B91C1C"/>
      <text x="910" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">可选警示色</text>
      <text x="910" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#B91C1C</text>
    </g>

    <g id="palette-success-color" data-description="可选成功色：#166534；使用要求：仅在表达增长、完成、正向结果时使用。">
      <rect x="1050" y="592" width="96" height="34" rx="6" fill="#166534"/>
      <text x="1050" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8070">可选成功色</text>
      <text x="1050" y="664" font-family="Arial, sans-serif" font-size="12" fill="#8C8070">#166534</text>
    </g>
  </g>
</svg>
